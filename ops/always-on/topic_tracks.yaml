      - Which India-specific health, supplement, diagnostics, wearable, or longevity signals create a sharper wedge or timing risk?
      - What regulatory, claims, safety, contraindication, or clinical-governance issue must be reviewed before any Eonic pilot or brief?
      - What evidence supports or weakens the manual WhatsApp concierge pilot as the next truth-machine?
      - What partnership terms or Sanath and Deep Holistics dependencies could protect or endanger Eonic's brand, user relationship, data learning loop, and protocol engine?
