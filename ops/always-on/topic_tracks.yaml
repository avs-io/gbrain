topic_tracks:
  - id: world-sovereign-ai-india
    slug: sovereign-ai-india
    tier: T0
    recipe_slug: sovereign-ai-india
    program_id: world-sovereign-ai-india
    title: Sovereign AI India
    status: active
    priority: 95
    objective: Maintain dynamic public-world intelligence on Indian sovereign AI policy, compute, company, procurement, and institutional signals.
    why_it_matters_to_chief: India sovereign AI is a high-leverage public-world topic for Chief because policy, compute procurement, foundation-model programs, and Indian AI company moves can change strategic timing, partnerships, capital allocation, and OpenClaw/GBrain opportunity surfaces.
    decision_surfaces:
      - weekly sovereign AI strategy brief
      - compute procurement and policy watchlist
      - company and institution opportunity radar
      - agent handoff for deep scout or action proposal
    standing_questions:
      - What new Indian government policy, procurement, or funding signal changes the sovereign AI landscape?
      - Which Indian AI companies or institutions gained meaningful capability, distribution, compute, or regulatory advantage?
      - What concrete wedge, partnership, product, or investment opportunity becomes newly timed for Chief?
      - What claims are contradicted, stale, under-evidenced, or require verification before surfacing?
    seed_queries:
      - India sovereign AI compute policy IndiaAI GPU tender
      - MeitY sovereign AI foundation model India
      - IndiaAI mission compute capacity sovereign AI
      - Bhashini sovereign AI model India
      - Sovereign AI India procurement GPU cloud
    watch_entities:
      - MeitY
      - IndiaAI Mission
      - Digital India Corporation
      - Bhashini
      - CDAC
      - Reliance
      - Tata Communications
      - Yotta
      - Sarvam AI
      - Krutrim
    source_classes:
