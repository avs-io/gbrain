        - OpenClaw or GBrain product implication
        - Indian AI company partnership or market wedge
        - compute access or procurement timing
        - policy/regulatory timing advantage
        - strategic relationship or meeting relevance
    cadence:
      discovery_hours: 2
      delta_compile_hours: 6
      daily_state: true
      weekly_deep_synthesis: true
    budgets:
      minimax_calls_per_day: 10000
      max_sources_per_day: 1500
      max_interrupts_per_day: 3
      max_external_fetches: 0
