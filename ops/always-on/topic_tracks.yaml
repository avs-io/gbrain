    success_metrics:
      - New public claims, entities, events, and opportunities are reduced into durable topic state instead of prose-only reports.
      - Every surfaced recommendation has source refs and an explicit opportunity lens.
      - The topic can generate ready ops WorkItems for discovery, fetch, extraction, reduction, and scoring without live web access in tests.
      - Stale or contradicted claims are flagged before Chief-facing synthesis.
    autonomy:
      can_ingest_public_sources: true
      can_create_world_claim_proposals: true
      can_mutate_trusted_memory: false
      can_contact_people: false
