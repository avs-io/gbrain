        url: https://www.olakrutrim.com/
        authority_tier: medium
        fetch_policy: crawl_allowed
        robots_required: true
        max_fetches_per_day: 3
      - id: public-social-disabled
        source_class: social_signal
        label: Public social signals disabled until explicit source authorization
        query: sovereign AI India MeitY IndiaAI Sarvam Krutrim
        authority_tier: low
        fetch_policy: disabled
        robots_required: true
        max_fetches_per_day: 0
